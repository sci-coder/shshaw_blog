baseURL: https://sci-coder.github.io/shshaw_blog/
languageCode: en-us
defaultContentLanguage: en
title: Hashed Science
theme: PaperMod  # Stable theme that works with all Hugo versions

# SEO: sitemap.xml, robots.txt and RSS help search engines find and re-crawl pages.
enableRobotsTXT: true
sitemap:
  changeFreq: weekly
  priority: 0.5
  filename: sitemap.xml

params:
  # SEO + social previews. CI builds in production mode, so PaperMod emits Open Graph,
  # Twitter-card and schema.org JSON-LD tags; `env` makes local builds do the same.
  env: production
  description: "Hashed Science by Syed Hashim Shah: picture-first articles on quantitative ML, generative AI for finance, physics-based machine learning and optimization."
  keywords: ["quantitative finance", "machine learning", "generative AI", "physics-based machine learning", "optimization", "statistical physics", "risk management", "Syed Hashim Shah"]
  author: "Syed Hashim Shah"
  images: ["images/og-default.png"]   # default share image (1200x630) for pages without a cover
  schema:
    publisherType: "Person"
    sameAs:
      - "https://github.com/sci-coder"
      - "https://www.linkedin.com/in/syed-hashim-shah/"
  # Paste the codes from Google Search Console / Bing Webmaster Tools here to verify the site.
  analytics:
    google:
      SiteVerificationTag: "m5RbBCpBFqWSujkVNnM3wtAJJGzg7juH-tDSv6NxUYk"
    bing:
      SiteVerificationTag: ""
  ShowRssButtonInSectionTermList: true

  # Default to dark mode (visitors can still toggle; choice is remembered)
  defaultTheme: dark

  # Show reading time
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  # Home page configuration
  profileMode:
    enabled: true
    title: "Physics, Machine Learning and Quantitative Finance"
    subtitle: "Picture-first notes and explainers by Syed Hashim Shah"
    imageUrl: "" # You can add a profile image URL later
    imageTitle: "Profile Picture"
    buttons:
      - name: Posts
        url: posts
      - name: GitHub
        url: "https://github.com/sci-coder"

  # Social Icons (update with your links)
  socialIcons:
    - name: github
      url: "https://github.com/sci-coder"
    - name: linkedin
      url: "https://www.linkedin.com/in/syed-hashim-shah/"
    - name: email
      url: "mailto:syed.hashim.shahh@gmail.com"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: fun
      name: Fun
      url: /fun/
      weight: 27
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    # Example: External Quarto site link
    # - identifier: external-quarto
    #   name: "📊 Data Science"
    #   url: "https://sci-coder.github.io/quarto-site/"
    #   weight: 40
    #   params:
    #     external: true

# Search index (JSON) + RSS feed (index.xml)
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Allow raw HTML in markdown files (needed for animations)
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]